name: First official site crawl pilot
on:
  push:
    paths:
      - '.github/workflows/site-crawl-pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-site-crawler.txt
      - name: Check actual government websites, limited backfill
        shell: bash
        run: |
          python scripts/crawl_official_sites.py --source-id project_stats_2026 --max-pages 1 --max-details 1 --attachments
          python scripts/crawl_official_sites.py --source-id policy_mof --max-pages 2 --max-details 12
          python scripts/crawl_official_sites.py --source-id project_nsfc_management --max-pages 1 --max-details 12
      - name: Export source counts and blocked-page audit
        shell: bash
        run: |
          python - <<'PY'
          import csv, sqlite3
          from pathlib import Path
          p=Path('data/site_crawl')
          con=sqlite3.connect(p/'materials.sqlite')
          for table,query in [
            ('audit.csv',"SELECT source_id,url,outcome,detail,checked_at FROM crawl_log ORDER BY checked_at"),
            ('counts.csv',"SELECT source_id, COUNT(*) AS documents FROM documents GROUP BY source_id")
          ]:
            rows=con.execute(query)
            with (p/table).open('w',newline='',encoding='utf-8-sig') as f:
              writer=csv.writer(f);writer.writerow([a[0] for a in rows.description]);writer.writerows(rows.fetchall())
          print('DOC_COUNT',con.execute('SELECT COUNT(*) FROM documents').fetchone()[0])
          print('ATTACHMENT_COUNT',con.execute('SELECT COUNT(*) FROM attachments').fetchone()[0])
          print('EXTRACTED_CANDIDATE_COUNT',con.execute('SELECT COUNT(*) FROM extracted_candidates').fetchone()[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-pilot-metadata
          path: |
            data/site_crawl/documents.csv
            data/site_crawl/crawl_summary.json
            data/site_crawl/audit.csv
            data/site_crawl/counts.csv
          retention-days: 7
          if-no-files-found: error
