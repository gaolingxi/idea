name: Provincial official HTML grant list ingestion
on:
  push:
    paths:
      - '.github/workflows/provincial-html-lists.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: province-socsc-metadata
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site-crawler.txt
      - run: python -m py_compile scripts/collect_provincial_html.py
      - name: Collect Zhejiang and Inner Mongolia official tables
        run: python scripts/collect_provincial_html.py
      - name: Validate ingestion
        run: |
          python - <<'PY'
          import json
          a=json.load(open("data/provincial_socsc/html_audit.json",encoding="utf8"))
          print(a)
          if not any(t["added"]>0 for t in a["targets"]):
              raise SystemExit("No new official HTML project titles extracted")
          PY
      - name: Commit grant titles with official provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_metadata/provincial_socsc_projects.csv
          if ! git diff --staged --quiet; then
            git commit -m "Add official provincial HTML research grant title rows"
            git push origin HEAD:main
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provincial-html-audit
          path: data/provincial_socsc/html_audit.json
          retention-days: 7
          if-no-files-found: warn
