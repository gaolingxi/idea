name: Hourly NSFC and provincial social-science grant collection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hourly-three-grant-sources.yml'
  schedule:
    - cron: '10 * * * *'

permissions:
  contents: write

concurrency:
  group: three-grant-hourly-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-source parser dependencies
        run: python -m pip install -r requirements-site-crawler.txt
      - name: Check scripts before network operations
        run: |
          python -m py_compile scripts/grant_hourly_monitor.py scripts/collect_provincial_socsc.py scripts/collect_provincial_html.py scripts/export_national_grant_candidates.py
          python -m unittest discover -s tests -p 'test_site_crawler.py' -v
      - name: Scan official national and 31-province source registry
        run: python scripts/grant_hourly_monitor.py --delay 2
      - name: Reconcile published provincial official PDF project rows
        run: python scripts/collect_provincial_socsc.py --delay 2
      - name: Reconcile published provincial official HTML project rows
        run: python scripts/collect_provincial_html.py
      - name: Locate and parse national NSFC notices and PDFs
        run: |
          python scripts/crawl_official_sites.py --db data/grant_national/materials.sqlite --source-id project_nsfc_management --attachments --max-pages 2 --max-details 15
      - name: Separate national individual PDF candidates from official notices
        run: python scripts/export_national_grant_candidates.py
      - name: Verify output files and count categories
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          rows={}
          for f in ['grant_source_notices.csv','provincial_socsc_projects.csv','national_grant_project_candidates.csv']:
            p=Path('public_metadata')/f
            with p.open(encoding='utf-8-sig',newline='') as inp:
              data=list(csv.DictReader(inp))
            rows[f]=len(data)
          audit=json.loads(Path('data/grant_hourly/grant_source_audit.json').read_text(encoding='utf-8'))
          assert audit['registered_sources']>=6
          assert rows['provincial_socsc_projects.csv']>=1000, 'Existing provincial rows unexpectedly lost'
          print('CATEGORY_ROW_COUNTS',json.dumps(rows,ensure_ascii=False))
          print('MONITORED_SOURCES',audit['registered_sources'],'ACCESSIBLE',audit['successful_sources'],'BLOCKED',audit['blocked_sources'])
          print('IMPORTANT: source notices and review-required candidates are NOT formal item-level awards')
          PY
      - name: Commit changed public metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_metadata/grant_source_notices.csv public_metadata/provincial_socsc_projects.csv public_metadata/national_grant_project_candidates.csv
          if git diff --staged --quiet; then
            echo "No new verified-source metadata or candidate rows"
          else
            git commit -m "Hourly grant registry update: NSFC provincial"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload audit only; archive raw downloads within runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grant-nsfc-provincial-audit
          path: |
            data/grant_hourly/grant_source_audit.json
            data/grant_national/crawl_summary.json
            data/provincial_socsc/crawl_audit.json
            data/provincial_socsc/html_audit.json
          retention-days: 7
          if-no-files-found: warn
