name: Collect MOE Humanities 2025-2026 Award Titles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_moe_humanities_projects.py'
      - 'sources/moe_humanities_2025_2026_registry.json'
      - 'tests/test_moe_humanities_projects.py'
      - '.github/workflows/collect-moe-humanities.yml'
permissions:
  contents: write
concurrency:
  group: moe-humanities-award-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public PDF parser
        run: python -m pip install -r requirements-site-crawler.txt
      - name: Verify script and category logic
        run: |
          python -m py_compile scripts/collect_moe_humanities_projects.py
          python -m unittest discover -s tests -p test_moe_humanities_projects.py -v
      - name: Extract all reachable 2025 formal and 2026 publicity PDFs
        shell: bash
        run: |
          python scripts/collect_moe_humanities_projects.py --output public_metadata/moe_humanities_2025_2026_projects.csv --audit reports/moe_humanities_2025_2026_audit.json || echo "Some sources blocked or no extractable tables; audit remains authoritative"
      - name: Confirm that exported rows actually match passed source audits
        run: |
          python - <<'PY'
          import csv, json, pathlib
          audit=json.loads(pathlib.Path('reports/moe_humanities_2025_2026_audit.json').read_text())
          p=pathlib.Path('public_metadata/moe_humanities_2025_2026_projects.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig',newline=''))) if p.exists() else []
          expected=sum(x['published_count'] for x in audit['per_source'] if x['result']=='PASS')
          assert len(rows)==expected,(len(rows),expected)
          assert len(rows)==len({(r['year'],r['listing_group'],r['list_sequence']) for r in rows})
          assert all(r['award_status']==('formal_award' if r['year']=='2025' else 'public_review_not_formal_award') for r in rows)
          print("AUDITED_MOE_ROWS",len(rows),"BY_YEAR",audit['by_year'])
          PY
      - name: Commit only verified item-level records and source audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/moe_humanities_2025_2026_audit.json
          if test -f public_metadata/moe_humanities_2025_2026_projects.csv; then git add public_metadata/moe_humanities_2025_2026_projects.csv; fi
          if git diff --staged --quiet; then
            echo "No new auditable MOE metadata"
          else
            git commit -m "Collect audited 2025 formal / 2026 publicity MOE humanities project names"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Record original PDF only as ephemeral workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moe-humanities-extraction-audit
          path: |
            reports/moe_humanities_2025_2026_audit.json
          retention-days: 7
          if-no-files-found: warn
