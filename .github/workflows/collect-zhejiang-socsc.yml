name: Extract Zhejiang official provincial social science project lists
on:
  push:
    paths:
      - '.github/workflows/collect-zhejiang-socsc.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: province-socsc-metadata
  cancel-in-progress: false
jobs:
  zhejiang:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site-crawler.txt
      - name: Fetch four official PDF attachments and extract individual titles
        run: python scripts/collect_provincial_socsc.py --province 浙江 --delay 2
      - name: Commit deduplicated official rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_metadata/provincial_socsc_projects.csv
          if ! git diff --staged --quiet; then
            git commit -m "Add Zhejiang provincial society research projects (official PDF rows)"
            git push origin HEAD:main
          fi
      - name: Export audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhejiang-source-audit
          path: data/provincial_socsc/crawl_audit.json
          retention-days: 7
