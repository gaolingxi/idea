name: Verify NSFC public award list parser
on:
  push:
    paths:
      - 'scripts/collect_nsfc_awards_from_universities.py'
      - 'tests/test_nsfc_award_seed_parser.py'
      - 'sources/nsfc_award_source_registry.json'
      - '.github/workflows/verify-nsfc-awards-parser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site-crawler.txt
      - run: python -m py_compile scripts/collect_nsfc_awards_from_universities.py
      - run: python -m unittest discover -s tests -p test_nsfc_award_seed_parser.py -v
